<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WordPressサイトのEnclosure一覧取得</title>
  <style>
    :root {
      --bg-1: #020617;
      --bg-2: #111827;
      --panel: rgba(15, 23, 42, 0.85);
      --panel-border: #243244;
      --text: #e5eef8;
      --muted: #93a4b8;
      --danger: #f87171;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(56, 189, 248, 0.16), transparent 32%),
        radial-gradient(circle at bottom right, rgba(34, 197, 94, 0.12), transparent 26%),
        linear-gradient(150deg, var(--bg-1), #0f172a 45%, var(--bg-2));
      min-height: 100vh;
    }

    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 24px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.7rem, 4vw, 2.5rem);
      line-height: 1.15;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .lead {
      max-width: 820px;
      margin-bottom: 20px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      padding: 18px;
      backdrop-filter: blur(10px);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.24);
      margin-bottom: 16px;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 120px 140px;
      gap: 10px;
      align-items: center;
    }

    input[type="text"],
    select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #091221;
      color: var(--text);
      font: inherit;
    }

    input::placeholder {
      color: #6b7c92;
    }

    button {
      padding: 12px 16px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #38bdf8, #22d3ee);
      color: #082f49;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .inline-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid #334155;
    }

    .status {
      margin-top: 12px;
      min-height: 22px;
      color: var(--muted);
    }

    .status.error {
      color: var(--danger);
    }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      color: var(--muted);
    }

    .pill-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pill {
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #223247;
      font-size: 0.9rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
      gap: 14px;
    }

    .enclosure-item {
      border: 1px solid #203041;
      border-radius: 16px;
      background: rgba(9, 18, 33, 0.95);
      padding: 16px;
      word-break: break-all;
    }

    .enclosure-item a {
      color: #7dd3fc;
      text-decoration: none;
    }

    .enclosure-item a:hover {
      text-decoration: underline;
    }

    .enclosure-info {
      margin-top: 12px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .enclosure-info div {
      margin-top: 6px;
    }

    .empty {
      padding: 24px;
      border-radius: 16px;
      border: 1px dashed #334155;
      color: var(--muted);
      text-align: center;
      line-height: 1.8;
    }

    .note-list {
      display: grid;
      gap: 8px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 16px;
    }

    @media (max-width: 760px) {
      .wrap {
        padding: 16px;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>WordPressサイトのEnclosure一覧取得</h1>
    <p class="lead">
      WordPressサイトのURLを入力すると、REST APIを通じてメディアライブラリ内のenclosure（メディアファイル）一覧を取得します。
    </p>

    <section class="panel">
      <div class="controls">
        <input id="siteInput" type="text" placeholder="例: https://example.com" />
        <select id="fileType" aria-label="ファイルタイプ">
          <option value="all">すべて</option>
          <option value="video">動画のみ</option>
          <option value="image">画像のみ</option>
        </select>
        <button id="fetchBtn">取得する</button>
      </div>
      <div class="inline-actions">
        <button id="sampleBtn" class="ghost" type="button">サンプルを入れる</button>
        <button id="clearBtn" class="ghost" type="button">結果をクリア</button>
      </div>
      <div id="status" class="status"></div>
      <div class="note-list">
        <div>取得方法: WordPress REST API <code>/wp-json/wp/v2/media</code> を使用</div>
        <div>ページネーション対応: 最大100件ずつ取得し、複数ページをサポート</div>
        <div>注意: メディアライブラリが公開されていない場合は取得できません</div>
      </div>
    </section>

    <section class="panel">
      <div class="meta">
        <div class="pill-row">
          <div class="pill">サイト: <span id="currentSite">-</span></div>
          <div class="pill">ファイル数: <span id="enclosureCount">0</span></div>
          <div class="pill">ページ: <span id="currentPage">1</span> / <span id="totalPages">1</span></div>
        </div>
      </div>
      <div id="pagination" class="pagination" style="display: none;">
        <button id="prevBtn" disabled>前へ</button>
        <button id="nextBtn" disabled>次へ</button>
      </div>
      <div id="results" class="grid"></div>
    </section>
  </div>

  <script>
    const CORS_PROXY_ENDPOINT = "https://api.codetabs.com/v1/proxy/?quest=";

    const siteInput = document.getElementById("siteInput");
    const fileType = document.getElementById("fileType");
    const fetchBtn = document.getElementById("fetchBtn");
    const sampleBtn = document.getElementById("sampleBtn");
    const clearBtn = document.getElementById("clearBtn");
    const statusEl = document.getElementById("status");
    const resultsEl = document.getElementById("results");
    const currentSiteEl = document.getElementById("currentSite");
    const enclosureCountEl = document.getElementById("enclosureCount");
    const currentPageEl = document.getElementById("currentPage");
    const totalPagesEl = document.getElementById("totalPages");
    const pagination = document.getElementById("pagination");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    let allEnclosures = [];
    let currentPage = 1;
    let currentSiteUrl = "";
    const filesPerPage = 20;

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.classList.toggle("error", isError);
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function normalizeSiteUrl() {
      const url = siteInput.value.trim();
      if (!url) {
        throw new Error("サイトURLを入力してください。");
      }
      try {
        const parsed = new URL(url);
        if (!/^https?:$/i.test(parsed.protocol)) {
          throw new Error("httpまたはhttpsのURLを入力してください。");
        }
        return parsed.origin;
      } catch (_) {
        throw new Error("有効なURLを入力してください。");
      }
    }

    async function fetchJson(url) {
      const response = await fetch(url, {
        headers: {
          Accept: "application/json, text/plain;q=0.9, */*;q=0.8"
        }
      });
      if (!response.ok) {
        throw new Error(`取得に失敗しました: ${response.status} ${response.statusText}`);
      }
      const text = await response.text();
      try {
        return JSON.parse(text);
      } catch (_) {
        throw new Error("JSONの解析に失敗しました。");
      }
    }

    function getMediaType(mimeType) {
      if (mimeType.startsWith("video/")) return "video";
      if (mimeType.startsWith("image/")) return "image";
      if (mimeType.startsWith("audio/")) return "audio";
      return "other";
    }

    function convertBytes(bytes) {
      if (bytes === 0) return "0 B";
      const k = 1024;
      const sizes = ["B", "KB", "MB", "GB"];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return Math.round(bytes / Math.pow(k, i) * 100) / 100 + " " + sizes[i];
    }

    function renderEmpty(message) {
      resultsEl.innerHTML = `<div class="empty">${escapeHtml(message)}</div>`;
    }

    function renderPage(page) {
      const start = (page - 1) * filesPerPage;
      const end = start + filesPerPage;
      const pageEnclosures = allEnclosures.slice(start, end);

      if (pageEnclosures.length === 0) {
        renderEmpty("このページにはファイルがありません。");
        return;
      }

      resultsEl.innerHTML = pageEnclosures.map((file) => `
        <div class="enclosure-item">
          <a href="${escapeHtml(file.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(decodeURIComponent(file.url))}</a>
          <div class="enclosure-info">
            <div><strong>タイプ:</strong> ${escapeHtml(file.type)}</div>
            ${file.size ? `<div><strong>サイズ:</strong> ${escapeHtml(file.size)}</div>` : ""}
            ${file.title ? `<div><strong>タイトル:</strong> ${escapeHtml(file.title)}</div>` : ""}
            ${file.description ? `<div><strong>説明:</strong> ${escapeHtml(file.description.substring(0, 100))}</div>` : ""}
          </div>
        </div>
      `).join("");

      const totalPages = Math.ceil(allEnclosures.length / filesPerPage);
      prevBtn.disabled = page === 1;
      nextBtn.disabled = page === totalPages;
    }

    function updateMeta(siteUrl, count) {
      currentSiteEl.textContent = siteUrl || "-";
      enclosureCountEl.textContent = String(count);
      const totalPages = Math.ceil(count / filesPerPage);
      totalPagesEl.textContent = String(totalPages);
      currentPageEl.textContent = String(currentPage);
      pagination.style.display = count > filesPerPage ? "flex" : "none";
    }

    function clearResults() {
      siteInput.value = "";
      resultsEl.innerHTML = "";
      setStatus("");
      allEnclosures = [];
      currentPage = 1;
      currentSiteUrl = "";
      updateMeta("", 0);
      renderEmpty("ここにEnclosure一覧が表示されます。");
    }

    async function fetchAllMedia() {
      fetchBtn.disabled = true;

      try {
        const siteUrl = normalizeSiteUrl();
        currentSiteUrl = siteUrl;
        updateMeta(siteUrl, 0);
        renderEmpty("メディアライブラリを取得しています...");
        setStatus("メディアライブラリを取得しています...");

        let allMedia = [];
        let page = 1;
        let totalPages = 1;

        while (page <= totalPages) {
          setStatus(`メディア取得中... ${page}/${totalPages}ページ目`);
          
          const restUrl = `${siteUrl}/wp-json/wp/v2/media?per_page=100&page=${page}`;
          const proxyUrl = `${CORS_PROXY_ENDPOINT}${encodeURIComponent(restUrl)}`;
          
          const response = await fetch(proxyUrl);
          if (!response.ok) {
            throw new Error(`取得に失敗しました: ${response.status}`);
          }
          
          const text = await response.text();
          const mediaData = JSON.parse(text);

          if (Array.isArray(mediaData)) {
            allMedia = allMedia.concat(mediaData);
          }

          const totalHeader = response.headers.get("X-WP-Total");
          if (totalHeader) {
            totalPages = Math.ceil(totalHeader / 100);
          }

          page++;
        }

        // フィルタリング
        let filtered = allMedia.map(media => ({
          url: media.source_url,
          title: media.title?.rendered || media.title || "",
          description: media.description?.rendered || media.description || "",
          mimeType: media.mime_type || "unknown",
          type: getMediaType(media.mime_type || "unknown"),
          size: media.media_details?.filesize ? convertBytes(media.media_details.filesize) : ""
        }));

        if (fileType.value !== "all") {
          filtered = filtered.filter(f => f.type === fileType.value);
        }

        allEnclosures = filtered;
        currentPage = 1;
        renderPage(currentPage);
        updateMeta(currentSiteUrl, allEnclosures.length);
        setStatus(`完了: ${allEnclosures.length} 件のファイルを取得しました。`);
      } catch (error) {
        const message = error instanceof Error ? error.message : String(error);
        renderEmpty("メディアライブラリを取得できませんでした。URLやネットワーク状態を確認してください。");
        setStatus(`エラー: ${message}`, true);
      } finally {
        fetchBtn.disabled = false;
      }
    }

    fetchBtn.addEventListener("click", fetchAllMedia);
    sampleBtn.addEventListener("click", () => {
      siteInput.value = "https://wordpress.com";
      siteInput.focus();
    });
    clearBtn.addEventListener("click", clearResults);
    siteInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        fetchAllMedia();
      }
    });

    prevBtn.addEventListener("click", () => {
      if (currentPage > 1) {
        currentPage--;
        renderPage(currentPage);
        updateMeta(currentSiteUrl, allEnclosures.length);
      }
    });

    nextBtn.addEventListener("click", () => {
      const totalPages = Math.ceil(allEnclosures.length / filesPerPage);
      if (currentPage < totalPages) {
        currentPage++;
        renderPage(currentPage);
        updateMeta(currentSiteUrl, allEnclosures.length);
      }
    });

    renderEmpty("ここにEnclosure一覧が表示されます。");
  </script>
</body>
</html>
