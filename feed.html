<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WordPressサイトのフィード一覧取得</title>
  <style>
    :root {
      --bg-1: #020617;
      --bg-2: #111827;
      --panel: rgba(15, 23, 42, 0.85);
      --panel-border: #243244;
      --text: #e5eef8;
      --muted: #93a4b8;
      --danger: #f87171;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(56, 189, 248, 0.16), transparent 32%),
        radial-gradient(circle at bottom right, rgba(34, 197, 94, 0.12), transparent 26%),
        linear-gradient(150deg, var(--bg-1), #0f172a 45%, var(--bg-2));
      min-height: 100vh;
    }

    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 24px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.7rem, 4vw, 2.5rem);
      line-height: 1.15;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .lead {
      max-width: 820px;
      margin-bottom: 20px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      padding: 18px;
      backdrop-filter: blur(10px);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.24);
      margin-bottom: 16px;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 80px 100px 140px;
      gap: 10px;
      align-items: center;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #091221;
      color: var(--text);
      font: inherit;
    }

    input::placeholder {
      color: #6b7c92;
    }

    button {
      padding: 12px 16px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #38bdf8, #22d3ee);
      color: #082f49;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .inline-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid #334155;
    }

    .status {
      margin-top: 12px;
      min-height: 22px;
      color: var(--muted);
    }

    .status.error {
      color: var(--danger);
    }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      color: var(--muted);
    }

    .pill-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pill {
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #223247;
      font-size: 0.9rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
      gap: 14px;
    }

    .video-item {
      border: 1px solid #203041;
      border-radius: 16px;
      background: rgba(9, 18, 33, 0.95);
      padding: 16px;
      word-break: break-all;
    }

    .video-item a {
      color: #7dd3fc;
      text-decoration: none;
    }

    .video-item a:hover {
      text-decoration: underline;
    }

    .empty {
      padding: 24px;
      border-radius: 16px;
      border: 1px dashed #334155;
      color: var(--muted);
      text-align: center;
      line-height: 1.8;
    }

    .note-list {
      display: grid;
      gap: 8px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 16px;
    }

    @media (max-width: 760px) {
      .wrap {
        padding: 16px;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>WordPressサイトの動画一覧取得</h1>
    <p class="lead">
      WordPressサイトのURLを入力すると、そのサイトのRSSフィードから動画URLを抽出して一覧を表示します。
    </p>

    <section class="panel">
      <div class="controls">
        <input id="siteInput" type="text" placeholder="例: https://example.com" />
        <select id="postCount" aria-label="取得件数">
          <option value="10">10件</option>
          <option value="50">50件</option>
          <option value="100">100件</option>
        </select>
        <select id="fetchMethod" aria-label="取得方法">
          <option value="feed">RSSフィード</option>
          <option value="rest">REST API</option>
        </select>
        <button id="fetchBtn">取得する</button>
      </div>
      <div class="inline-actions">
        <button id="sampleBtn" class="ghost" type="button">サンプルを入れる</button>
        <button id="clearBtn" class="ghost" type="button">結果をクリア</button>
      </div>
      <div id="status" class="status"></div>
      <div class="note-list">
        <div>フィードURL: 入力したURLの <code>/feed/</code> または <code>/wp-json/wp/v2/posts</code> を自動的に試します</div>
        <div>取得方法: CORSプロキシ経由でデータを解析し、<code>&lt;enclosure&gt;</code> タグまたはメタフィールドから動画URLを抽出</div>
        <div>注意: フィード/APIが公開されていない場合や、CORS制限がある場合は取得できません</div>
      </div>
    </section>

    <section class="panel">
      <div class="meta">
        <div class="pill-row">
          <div class="pill">サイト: <span id="currentSite">-</span></div>
          <div class="pill">動画数: <span id="articleCount">0</span></div>
          <div class="pill">ページ: <span id="currentPage">1</span> / <span id="totalPages">1</span></div>
        </div>
      </div>
      <div id="pagination" class="pagination" style="display: none;">
        <button id="prevBtn" disabled>前へ</button>
        <button id="nextBtn" disabled>次へ</button>
      </div>
      <div id="results" class="grid"></div>
    </section>
  </div>

  <script>
    const CORS_PROXY_ENDPOINT = "https://api.codetabs.com/v1/proxy/?quest=";

    const siteInput = document.getElementById("siteInput");
    const postCount = document.getElementById("postCount");
    const fetchMethod = document.getElementById("fetchMethod");
    const fetchBtn = document.getElementById("fetchBtn");
    const sampleBtn = document.getElementById("sampleBtn");
    const clearBtn = document.getElementById("clearBtn");
    const statusEl = document.getElementById("status");
    const resultsEl = document.getElementById("results");
    const currentSiteEl = document.getElementById("currentSite");
    const articleCountEl = document.getElementById("articleCount");
    const currentPageEl = document.getElementById("currentPage");
    const totalPagesEl = document.getElementById("totalPages");
    const pagination = document.getElementById("pagination");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    let allItems = [];
    let currentPage = 1;
    let currentSiteUrl = "";
    const videosPerPage = 20;

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.classList.toggle("error", isError);
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function normalizeSiteUrl() {
      const url = siteInput.value.trim();
      if (!url) {
        throw new Error("サイトURLを入力してください。");
      }
      try {
        const parsed = new URL(url);
        if (!/^https?:$/i.test(parsed.protocol)) {
          throw new Error("httpまたはhttpsのURLを入力してください。");
        }
        return parsed.origin;
      } catch (_) {
        throw new Error("有効なURLを入力してください。");
      }
    }

    async function fetchJson(url) {
      const response = await fetch(url, {
        headers: {
          Accept: "application/json, text/plain;q=0.9, */*;q=0.8"
        }
      });
      if (!response.ok) {
        throw new Error(`取得に失敗しました: ${response.status} ${response.statusText}`);
      }
      const text = await response.text();
      try {
        return JSON.parse(text);
      } catch (_) {
        throw new Error("JSONの解析に失敗しました。");
      }
    }

    function parseRest(jsonData) {
      // REST APIのレスポンスをパースしてenclosureUrlsを抽出
      // WordPress REST APIではenclosureはメタフィールドにある場合がある
      const items = [];
      jsonData.forEach((post) => {
        const enclosureUrls = [];
        if (post.meta && post.meta.enclosure) {
          // enclosureがメタにある場合
          enclosureUrls.push(post.meta.enclosure);
        }
        // 添付ファイルから動画を探す
        if (post._embedded && post._embedded['wp:featuredmedia']) {
          post._embedded['wp:featuredmedia'].forEach((media) => {
            if (media.source_url && (media.source_url.includes('.mp4') || media.source_url.includes('.mov') || media.source_url.includes('.m4v'))) {
              enclosureUrls.push(media.source_url);
            }
          });
        }
        // 記事本文からenclosureを探す（RSSのように）
        if (post.content && post.content.rendered) {
          const tempDiv = document.createElement('div');
          tempDiv.innerHTML = post.content.rendered;
          const enclosures = tempDiv.querySelectorAll('enclosure');
          enclosures.forEach((enc) => {
            const url = enc.getAttribute('url');
            if (url) enclosureUrls.push(url);
          });
        }
        if (enclosureUrls.length > 0) {
          items.push({
            title: post.title.rendered,
            link: post.link,
            description: post.excerpt ? post.excerpt.rendered.replace(/<[^>]+>/g, "") : "",
            pubDate: post.date,
            enclosureUrls
          });
        }
      });
      return items;
    }

    function renderEmpty(message) {
      resultsEl.innerHTML = `<div class="empty">${escapeHtml(message)}</div>`;
    }

    function renderPage(siteUrl, page) {
      const allEnclosures = allItems.flatMap(item => item.enclosureUrls);
      const start = (page - 1) * videosPerPage;
      const end = start + videosPerPage;
      const pageEnclosures = allEnclosures.slice(start, end);

      if (pageEnclosures.length === 0) {
        renderEmpty("このページには動画がありません。");
        return;
      }

      resultsEl.innerHTML = pageEnclosures.map((url) => `
        <div class="video-item">
          <a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(decodeURIComponent(url))}</a>
        </div>
      `).join("");

      // ボタンの状態更新
      const totalPages = Math.ceil(allEnclosures.length / videosPerPage);
      prevBtn.disabled = page === 1;
      nextBtn.disabled = page === totalPages;
    }

    function updateMeta(siteUrl, count) {
      currentSiteEl.textContent = siteUrl || "-";
      const videoCount = allItems.reduce((sum, item) => sum + item.enclosureUrls.length, 0);
      articleCountEl.textContent = String(videoCount);
      const totalPages = Math.ceil(videoCount / videosPerPage);
      totalPagesEl.textContent = String(totalPages);
      currentPageEl.textContent = String(currentPage);
      pagination.style.display = videoCount > videosPerPage ? "flex" : "none";
    }

    function clearResults() {
      siteInput.value = "";
      resultsEl.innerHTML = "";
      setStatus("");
      allItems = [];
      currentPage = 1;
      currentSiteUrl = "";
      updateMeta("", 0);
      renderEmpty("ここに動画一覧が表示されます。");
    }

    async function fetchFeed() {
      fetchBtn.disabled = true;

      try {
        const siteUrl = normalizeSiteUrl();
        currentSiteUrl = siteUrl;
        updateMeta(siteUrl, 0);
        renderEmpty("データを取得しています...");
        setStatus("データを取得しています...");

        let items = [];
        if (fetchMethod.value === "feed") {
          const feedUrl = `${siteUrl}/feed/?posts_per_rss=${postCount.value}`;
          const proxyUrl = `${CORS_PROXY_ENDPOINT}${encodeURIComponent(feedUrl)}`;
          const xmlText = await fetchText(proxyUrl);
          items = parseFeed(xmlText);
        } else {
          const restUrl = `${siteUrl}/wp-json/wp/v2/posts?per_page=${postCount.value}&_embed`;
          const proxyUrl = `${CORS_PROXY_ENDPOINT}${encodeURIComponent(restUrl)}`;
          const jsonData = await fetchJson(proxyUrl);
          items = parseRest(jsonData);
        }

        allItems = items;
        currentPage = 1;
        renderPage(currentSiteUrl, currentPage);
        updateMeta(currentSiteUrl, allItems.length);
        setStatus(`完了: ${allItems.length} 件の記事を取得しました。`);
      } catch (error) {
        const message = error instanceof Error ? error.message : String(error);
        renderEmpty("データを取得できませんでした。URLやネットワーク状態を確認してください。");
        setStatus(`エラー: ${message}`, true);
      } finally {
        fetchBtn.disabled = false;
      }
    }

    fetchBtn.addEventListener("click", fetchFeed);
    sampleBtn.addEventListener("click", () => {
      siteInput.value = "https://wordpress.com";
      siteInput.focus();
    });
    clearBtn.addEventListener("click", clearResults);
    siteInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        fetchFeed();
      }
    });

    prevBtn.addEventListener("click", () => {
      if (currentPage > 1) {
        currentPage--;
        renderPage(currentSiteUrl, currentPage);
        updateMeta(currentSiteUrl, allItems.length);
      }
    });

    nextBtn.addEventListener("click", () => {
      const allEnclosures = allItems.flatMap(item => item.enclosureUrls);
      const totalPages = Math.ceil(allEnclosures.length / videosPerPage);
      if (currentPage < totalPages) {
        currentPage++;
        renderPage(currentSiteUrl, currentPage);
        updateMeta(currentSiteUrl, allItems.length);
      }
    });

    renderEmpty("ここに動画一覧が表示されます。");
  </script>
</body>
</html>
