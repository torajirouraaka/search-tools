<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WordPress uploads メディア一覧</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-border: #1f2937;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --primary: #22d3ee;
      --danger: #f87171;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: sans-serif;
      background: linear-gradient(160deg, #020617, #0f172a 40%, #1e293b);
      color: var(--text);
      min-height: 100vh;
    }
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
    }
    h1 {
    font-size: 1.5rem;
      margin: 0 0 12px;
    }
    p {
      margin: 0 0 16px;
      color: var(--muted);
    }
    .panel {
      background: rgba(17, 24, 39, 0.85);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      backdrop-filter: blur(4px);
    }
    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    input[type="url"],
    input[type="search"],
    input[type="text"] {
      flex: 1;
      min-width: 260px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #374151;
      background: #0b1220;
      color: var(--text);
    }
    .filter input[type="search"] {
      flex: 1;
      min-width: 200px;
    }
    input[type="number"],
    select {
      width: 140px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #374151;
      background: #0b1220;
      color: var(--text);
    }
    button {
      padding: 10px 14px;
      border: 0;
      border-radius: 8px;
      background: var(--primary);
      color: #082f49;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    .status {
      margin-top: 12px;
      color: var(--muted);
      min-height: 20px;
    }
    .status.error { color: var(--danger); }
    .meta {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .filter {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .filter label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
    }
    .card {
      background: #0b1220;
      border: 1px solid #1f2937;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .thumb {
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      background: #020617;
      display: block;
    }
    .thumb-placeholder {
      width: 100%;
      aspect-ratio: 16 / 10;
      display: grid;
      place-items: center;
      background: #020617;
      color: #6b7280;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      font-weight: 700;
    }
    .info {
      padding: 8px;
      font-size: 0.8rem;
      color: var(--muted);
      word-break: break-all;
    }
    .info a {
      color: #7dd3fc;
      text-decoration: none;
    }
    .info a:hover { text-decoration: underline; }
    .subinfo {
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.75rem;
      line-height: 1.3;
      word-break: break-word;
    }
    .badge-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      line-height: 1;
    }
    .badge-used {
      background: rgba(34, 197, 94, 0.18);
      color: #86efac;
      border: 1px solid rgba(34, 197, 94, 0.35);
    }
    .badge-unused {
      background: rgba(156, 163, 175, 0.12);
      color: #d1d5db;
      border: 1px solid rgba(156, 163, 175, 0.25);
    }
    .empty-filter {
      grid-column: 1 / -1;
      padding: 24px;
      border-radius: 10px;
      border: 1px dashed #334155;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>WordPress uploads メディア一覧</h1>
    <p>WordPressサイトURLを入力すると、`wp/v2/media` から `uploads` 配下の画像/動画を一覧化します。`/wp/` などサブディレクトリ設置のサイトにも対応しています。</p>

    <div class="panel">
      <div class="row">
        <input id="siteUrl" type="url" placeholder="https://example.com または https://example.com/wp" />
        <select id="maxPages" aria-label="ページ数">
          <option value="">ページ数: すべて</option>
        </select>
        <select id="startPage" aria-label="開始ページ">
          <option value="">開始ページ: 1</option>
        </select>
        <select id="yearFilter" aria-label="年フィルタ">
          <option value="">年: すべて</option>
        </select>
        <select id="monthFilter" aria-label="月フィルタ">
          <option value="">月: すべて</option>
        </select>
        <button id="loadBtn">取得する</button>
      </div>
      <div id="status" class="status"></div>
    </div>

    <div class="panel">
      <div class="meta">
        <div>表示件数: <span id="count">0</span> / 全 <span id="totalCount">0</span> 件</div>
        <div id="targetHost">対象: -</div>
      </div>
      <div class="filter" id="mediaFilter">
        <input id="keywordFilter" type="search" placeholder="URL・ファイル名・タイトルで絞り込み" aria-label="キーワード絞り込み" />
        <label><input type="radio" name="mediaType" value="all" checked> すべて</label>
        <label><input type="radio" name="mediaType" value="image"> 画像のみ</label>
        <label><input type="radio" name="mediaType" value="video"> 動画のみ</label>
        <label><input type="radio" name="usageFilter" value="all" checked> 使用状況: すべて</label>
        <label><input type="radio" name="usageFilter" value="used"> 使用中のみ</label>
        <label><input type="radio" name="usageFilter" value="unused"> 未使用のみ</label>
      </div>
      <div id="grid" class="grid"></div>
    </div>
  </div>

  <script>
    const siteUrlInput = document.getElementById("siteUrl");
    const loadBtn = document.getElementById("loadBtn");
    const maxPagesInput = document.getElementById("maxPages");
    const startPageInput = document.getElementById("startPage");
    const yearFilterInput = document.getElementById("yearFilter");
    const monthFilterInput = document.getElementById("monthFilter");
    const statusEl = document.getElementById("status");
    const gridEl = document.getElementById("grid");
    const countEl = document.getElementById("count");
    const totalCountEl = document.getElementById("totalCount");
    const targetHostEl = document.getElementById("targetHost");
    const mediaFilterEl = document.getElementById("mediaFilter");
    const keywordFilterInput = document.getElementById("keywordFilter");
    const CACHE_PREFIX = "wp-media-cache-v1:";
    let currentMedia = [];
    let renderedKeys = new Set();
    let keywordFilterTimer = null;

    function setStatus(text, isError = false) {
      statusEl.textContent = text;
      statusEl.classList.toggle("error", isError);
    }

    function normalizeBaseUrl(input) {
      const raw = input.trim();
      if (!raw) {
        throw new Error("URLを入力してください。");
      }
      const withProtocol = /^https?:\/\//i.test(raw) ? raw : `https://${raw}`;
      const url = new URL(withProtocol);

      let path = url.pathname.replace(/\/+$/, "");
      const nonBaseSuffixes = [
        /\/wp-admin(?:\/.*)?$/i,
        /\/wp-content(?:\/.*)?$/i,
        /\/wp-includes(?:\/.*)?$/i,
        /\/wp-json(?:\/.*)?$/i,
        /\/feed$/i,
        /\/index\.php$/i
      ];
      for (const pattern of nonBaseSuffixes) {
        path = path.replace(pattern, "");
      }
      path = path.replace(/\/+$/, "");

      return path ? `${url.origin}${path}` : url.origin;
    }

    function parseMaxPagesInput() {
      const raw = maxPagesInput.value;
      if (!raw) return null;
      const num = Number(raw);
      if (!Number.isInteger(num) || num < 10 || num % 10 !== 0) {
        throw new Error("ページ数は10以上の10単位で入力してください。");
      }
      return num;
    }

    function parseStartPageInput() {
      const raw = startPageInput.value;
      if (!raw) return 1;
      const num = Number(raw);
      if (!Number.isInteger(num) || num < 10 || num % 10 !== 0) {
        throw new Error("開始ページは10以上の10単位で入力してください。");
      }
      return num;
    }

    function parseYearMonthFilter() {
      const yearRaw = yearFilterInput.value;
      const monthRaw = monthFilterInput.value;
      const year = yearRaw ? Number(yearRaw) : null;
      const month = monthRaw ? Number(monthRaw) : null;
      if (month !== null && year === null) {
        throw new Error("月を指定する場合は年も指定してください。");
      }
      return {
        year,
        month
      };
    }

    function toIsoDate(year, month, day) {
      const y = String(year);
      const m = String(month).padStart(2, "0");
      const d = String(day).padStart(2, "0");
      return `${y}-${m}-${d}T00:00:00`;
    }

    function buildDateQuery(year, month) {
      if (year == null) return {};
      if (month == null) {
        return {
          after: toIsoDate(year, 1, 1),
          before: toIsoDate(year + 1, 1, 1)
        };
      }
      const nextYear = month === 12 ? year + 1 : year;
      const nextMonth = month === 12 ? 1 : month + 1;
      return {
        after: toIsoDate(year, month, 1),
        before: toIsoDate(nextYear, nextMonth, 1)
      };
    }

    function initYearMonthOptions() {
      const thisYear = new Date().getFullYear();
      yearFilterInput.innerHTML = '<option value="">年: すべて</option>';
      for (let y = thisYear; y >= 2000; y -= 1) {
        const option = document.createElement("option");
        option.value = String(y);
        option.textContent = `${y}年`;
        yearFilterInput.appendChild(option);
      }

      monthFilterInput.innerHTML = '<option value="">月: すべて</option>';
      for (let m = 1; m <= 12; m += 1) {
        const option = document.createElement("option");
        option.value = String(m);
        option.textContent = `${m}月`;
        monthFilterInput.appendChild(option);
      }
    }

    function createWpSiteError(status, statusText = "") {
      const suffix = status ? ` (${status}${statusText ? ` ${statusText}` : ""})` : "";
      return new Error(`WordPressサイトではない可能性があります。REST API（…/wp-json/wp/v2/media）を確認できませんでした${suffix}`);
    }

    function initPageOptions() {
      maxPagesInput.innerHTML = '<option value="">ページ数: すべて</option>';
      startPageInput.innerHTML = '<option value="">開始ページ: 1</option>';

      for (let value = 10; value <= 500; value += 10) {
        const maxOption = document.createElement("option");
        maxOption.value = String(value);
        maxOption.textContent = `${value}ページ`;
        maxPagesInput.appendChild(maxOption);

        const startOption = document.createElement("option");
        startOption.value = String(value);
        startOption.textContent = `${value}ページ`;
        startPageInput.appendChild(startOption);
      }
    }

    function getCacheKey(baseUrl, maxPages) {
      const pagesPart = maxPages == null ? "all" : String(maxPages);
      return `${CACHE_PREFIX}${baseUrl}:pages=${pagesPart}`;
    }

    function loadCache(baseUrl, maxPages) {
      try {
        const raw = localStorage.getItem(getCacheKey(baseUrl, maxPages));
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (!parsed || !Array.isArray(parsed.items)) return null;
        return parsed;
      } catch (_) {
        return null;
      }
    }

    function saveCache(baseUrl, maxPages, items) {
      try {
        localStorage.setItem(
          getCacheKey(baseUrl, maxPages),
          JSON.stringify({
            cachedAt: new Date().toISOString(),
            items
          })
        );
      } catch (_) {
        // Ignore storage failures (quota or private mode restrictions).
      }
    }

    function getMediaKind(item) {
      if (!item) return null;
      if (item.media_type === "image") return "image";
      if (item.media_type === "video") return "video";

      // Some WordPress sites return videos as media_type: "file" + mime_type: "video/*".
      const mime = String(item.mime_type || "").toLowerCase();
      if (mime.startsWith("video/")) return "video";
      if (mime.startsWith("image/")) return "image";
      return null;
    }

    function isOriginalUploadMedia(item) {
      const kind = getMediaKind(item);
      if (!kind) return false;
      const url = item.source_url || "";
      if (!/\/uploads\//i.test(url)) return false;

      const pathname = new URL(url).pathname.toLowerCase();
      const filename = pathname.split("/").pop() || "";

      // For images, exclude WordPress generated variants such as "-scaled" and "-300x300".
      if (kind === "image") {
        if (/-scaled\.[a-z0-9]+$/i.test(filename)) return false;
        if (/-\d+x\d+\.[a-z0-9]+$/i.test(filename)) return false;
      }

      return true;
    }

    function createCard(item) {
      const card = document.createElement("div");
      card.className = "card";

      const kind = getMediaKind(item);

      if (getMediaKind(item) === "video") {
        const candidateThumbs = [
          item?.media_details?.sizes?.medium?.source_url,
          item?.media_details?.sizes?.thumbnail?.source_url,
          item?.media_details?.sizes?.full?.source_url,
          item?.featured_media_src_url
        ].filter(Boolean);

        if (candidateThumbs.length > 0) {
          const img = document.createElement("img");
          img.className = "thumb";
          img.loading = "lazy";
          img.src = candidateThumbs[0];
          img.alt = item.alt_text || item.title?.rendered || "video thumbnail";
          img.onerror = () => {
            const placeholder = document.createElement("div");
            placeholder.className = "thumb-placeholder";
            placeholder.textContent = "NO IMAGE";
            img.replaceWith(placeholder);
          };
          card.appendChild(img);
        } else {
          const placeholder = document.createElement("div");
          placeholder.className = "thumb-placeholder";
          placeholder.textContent = "NO IMAGE";
          card.appendChild(placeholder);
        }
      } else {
        const img = document.createElement("img");
        img.className = "thumb";
        img.loading = "lazy";
        img.src = item.source_url;
        img.alt = item.alt_text || item.title?.rendered || "image";
        card.appendChild(img);
      }

      const info = document.createElement("div");
      info.className = "info";

      const link = document.createElement("a");
      link.href = item.source_url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = item.source_url;
      info.appendChild(link);

      const badgeRow = document.createElement("div");
      badgeRow.className = "badge-row";

      const usageBadge = document.createElement("span");
      usageBadge.className = `badge ${isUsedMedia(item) ? "badge-used" : "badge-unused"}`;
      usageBadge.textContent = isUsedMedia(item) ? "使用中" : "未使用";
      badgeRow.appendChild(usageBadge);

      info.appendChild(badgeRow);

      if (kind === "video") {
        const durationSeconds =
          item?.media_details?.duration ?? item?.media_details?.length ?? item?.duration ?? null;
        const filesizeBytes =
          item?.media_details?.filesize ?? item?.filesize ?? item?.media_details?.file_size ?? null;

        const metaEl = document.createElement("div");
        metaEl.className = "subinfo";

        function formatDuration(seconds) {
          const s = Number(seconds);
          if (!Number.isFinite(s) || s <= 0) return null;
          const total = Math.round(s);
          const h = Math.floor(total / 3600);
          const m = Math.floor((total % 3600) / 60);
          const sec = total % 60;
          if (h > 0) return `${h}:${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
          return `${m}:${String(sec).padStart(2, "0")}`;
        }

        function formatBytes(bytes) {
          const n = Number(bytes);
          if (!Number.isFinite(n) || n <= 0) return null;
          const units = ["B", "KB", "MB", "GB", "TB"];
          let idx = 0;
          let v = n;
          while (v >= 1024 && idx < units.length - 1) {
            v /= 1024;
            idx += 1;
          }
          const rounded = idx === 0 ? v : Math.round(v * 10) / 10;
          return `${rounded} ${units[idx]}`;
        }

        const durationText = formatDuration(durationSeconds);
        const sizeText = formatBytes(filesizeBytes);
        metaEl.textContent = durationText ? `動画時間: ${durationText}` : (sizeText ? `容量: ${sizeText}` : "");

        if (metaEl.textContent) info.appendChild(metaEl);
      }

      card.appendChild(info);
      return card;
    }

    function getItemRenderKey(item) {
      return String(item.id ?? item.source_url ?? Math.random());
    }

    function filterMediaByType(items, mediaType) {
      if (mediaType === "image") {
        return items.filter((item) => getMediaKind(item) === "image");
      }
      if (mediaType === "video") {
        return items.filter((item) => getMediaKind(item) === "video");
      }
      return items;
    }

    function isUsedMedia(item) {
      return Number(item?.post || 0) > 0;
    }

    function getSelectedFilterType() {
      return document.querySelector('input[name="mediaType"]:checked')?.value || "all";
    }

    function getSelectedUsageFilter() {
      return document.querySelector('input[name="usageFilter"]:checked')?.value || "all";
    }

    function getMediaSearchText(item) {
      const filename = (() => {
        try {
          return new URL(item.source_url).pathname.split("/").pop() || "";
        } catch (_) {
          return "";
        }
      })();
      return [
        item.source_url,
        filename,
        item.title?.rendered,
        item.alt_text,
        item.slug,
        item.caption?.rendered
      ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();
    }

    function filterByKeyword(items) {
      const keyword = keywordFilterInput.value.trim().toLowerCase();
      if (!keyword) return items;
      const terms = keyword.split(/\s+/).filter(Boolean);
      return items.filter((item) => {
        const haystack = getMediaSearchText(item);
        return terms.every((term) => haystack.includes(term));
      });
    }

    function filterByUsage(items) {
      const usage = getSelectedUsageFilter();
      if (usage === "used") return items.filter((item) => isUsedMedia(item));
      if (usage === "unused") return items.filter((item) => !isUsedMedia(item));
      return items;
    }

    function applyMediaFilters(items) {
      return filterByKeyword(filterByUsage(filterMediaByType(items, getSelectedFilterType())));
    }

    function isFilterActive() {
      return (
        getSelectedFilterType() !== "all" ||
        getSelectedUsageFilter() !== "all" ||
        keywordFilterInput.value.trim() !== ""
      );
    }

    function updateResultCounts(filteredCount, totalCount) {
      countEl.textContent = String(filteredCount);
      totalCountEl.textContent = String(totalCount);
    }

    function renderMediaList(items, totalCount = currentMedia.length) {
      gridEl.innerHTML = "";
      renderedKeys = new Set();

      if (items.length === 0 && totalCount > 0) {
        const empty = document.createElement("div");
        empty.className = "empty-filter";
        empty.textContent = isFilterActive()
          ? "条件に一致するメディアがありません。フィルタ条件を変更してください。"
          : "表示できるメディアがありません。";
        gridEl.appendChild(empty);
      } else {
        items.forEach((item) => {
          renderedKeys.add(getItemRenderKey(item));
          gridEl.appendChild(createCard(item));
        });
      }

      updateResultCounts(items.length, totalCount);
    }

    function renderCurrentMediaByFilter(incremental = false) {
      const filteredMedia = applyMediaFilters(currentMedia);
      const totalCount = currentMedia.length;

      if (!incremental) {
        renderMediaList(filteredMedia, totalCount);
        return filteredMedia.length;
      }

      const fragment = document.createDocumentFragment();
      let appendedCount = 0;
      filteredMedia.forEach((item) => {
        const key = getItemRenderKey(item);
        if (renderedKeys.has(key)) return;
        renderedKeys.add(key);
        fragment.appendChild(createCard(item));
        appendedCount += 1;
      });
      if (appendedCount > 0) {
        gridEl.appendChild(fragment);
      }
      updateResultCounts(filteredMedia.length, totalCount);
      return filteredMedia.length;
    }

    async function fetchMediaPage(apiUrl, page, dateQuery) {
      const params = new URLSearchParams({
        per_page: "100",
        page: String(page)
      });
      if (dateQuery?.after) params.set("after", dateQuery.after);
      if (dateQuery?.before) params.set("before", dateQuery.before);

      const res = await fetch(`${apiUrl}?${params.toString()}`, {
        headers: { Accept: "application/json" }
      });
      if (!res.ok) {
        if (res.status === 404 || res.status === 405) {
          throw createWpSiteError(res.status, res.statusText);
        }
        throw new Error(`取得失敗: ${res.status} ${res.statusText}`);
      }

      const contentType = String(res.headers.get("content-type") || "").toLowerCase();
      if (!contentType.includes("application/json")) {
        throw createWpSiteError(res.status, res.statusText);
      }

      const totalPages = Number(res.headers.get("X-WP-TotalPages") || "1");
      let data;
      try {
        data = await res.json();
      } catch (_) {
        throw createWpSiteError(res.status, res.statusText);
      }

      if (!Array.isArray(data)) {
        throw createWpSiteError(res.status, res.statusText);
      }
      return { data, totalPages };
    }

    async function fetchAllMediaProgressively(baseUrl, maxPages, dateQuery, startPage) {
      const apiUrl = `${baseUrl}/wp-json/wp/v2/media`;

      const firstPage = startPage ?? 1;
      const first = await fetchMediaPage(apiUrl, firstPage, dateQuery);
      const totalPages = first.totalPages;

      if (firstPage > totalPages) {
        setStatus(`指定された開始ページ(${firstPage})以降にデータがありません。`, false);
        return [];
      }

      const targetPages = maxPages == null
        ? (totalPages - firstPage + 1)
        : Math.min(totalPages - firstPage + 1, maxPages);

      let all = [...first.data];
      let filteredSoFar = all.filter(isOriginalUploadMedia);
      currentMedia = filteredSoFar;
      let displayedCount = renderCurrentMediaByFilter(true);
      setStatus(`取得中... ${firstPage}/${firstPage + targetPages - 1} ページ (${displayedCount} 件表示中)`);

      for (let page = firstPage + 1; page <= firstPage + targetPages - 1; page += 1) {
        const next = await fetchMediaPage(apiUrl, page, dateQuery);
        all = all.concat(next.data);
        filteredSoFar = all.filter(isOriginalUploadMedia);
        currentMedia = filteredSoFar;
        displayedCount = renderCurrentMediaByFilter(true);
        setStatus(`取得中... ${page}/${firstPage + targetPages - 1} ページ (${displayedCount} 件表示中)`);
      }
      return filteredSoFar;
    }

    async function loadMedia() {
      loadBtn.disabled = true;
      gridEl.innerHTML = "";
      updateResultCounts(0, 0);
      currentMedia = [];
      renderedKeys = new Set();
      keywordFilterInput.value = "";

      try {
        const baseUrl = normalizeBaseUrl(siteUrlInput.value);
        const maxPages = parseMaxPagesInput();
        const startPage = parseStartPageInput();
        const { year, month } = parseYearMonthFilter();
        const dateQuery = buildDateQuery(year, month);
        targetHostEl.textContent = `対象: ${baseUrl}`;
        setStatus("取得開始...");

        const cacheKeyPart = `start=${startPage};pages=${maxPages ?? "all"};ym=${year ?? "all"}-${month ?? "all"}`;
        const cached = loadCache(baseUrl, cacheKeyPart);
        if (cached) {
          currentMedia = cached.items;
          renderCurrentMediaByFilter();
        } else {
          const uploadsMedia = await fetchAllMediaProgressively(baseUrl, maxPages, dateQuery, startPage);
          currentMedia = uploadsMedia;
          saveCache(baseUrl, cacheKeyPart, currentMedia);
        }

        const displayedCount = renderCurrentMediaByFilter();
        const totalCount = currentMedia.length;
        const countLabel = displayedCount === totalCount
          ? `${displayedCount} 件`
          : `${displayedCount} 件（全 ${totalCount} 件中）`;
        if (cached?.cachedAt) {
          setStatus(`完了(キャッシュ): ${countLabel}を表示しました。保存時刻 ${new Date(cached.cachedAt).toLocaleString()}`);
        } else {
          setStatus(`完了(新規取得): ${countLabel}を表示しました。`);
        }
      } catch (err) {
        const message = err instanceof Error ? err.message : String(err);
        setStatus(
          `エラー: ${message} (対象サイトでREST API/CORS制限がある可能性もあります)`,
          true
        );
      } finally {
        loadBtn.disabled = false;
      }
    }

    function handleFilterChange() {
      try {
        const filteredCount = renderCurrentMediaByFilter();
        if (currentMedia.length > 0) {
          const suffix = isFilterActive()
            ? `（全 ${currentMedia.length} 件中）`
            : "";
          setStatus(`フィルタ適用: ${filteredCount} 件を表示中${suffix}`);
        }
      } catch (err) {
        const message = err instanceof Error ? err.message : String(err);
        setStatus(`エラー: ${message}`, true);
      }
    }

    loadBtn.addEventListener("click", loadMedia);
    mediaFilterEl.addEventListener("change", handleFilterChange);
    keywordFilterInput.addEventListener("input", () => {
      clearTimeout(keywordFilterTimer);
      keywordFilterTimer = setTimeout(handleFilterChange, 200);
    });
    keywordFilterInput.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        keywordFilterInput.value = "";
        handleFilterChange();
      }
    });
    yearFilterInput.addEventListener("change", () => {
      if (yearFilterInput.value === "") {
        monthFilterInput.value = "";
      }
    });
    initPageOptions();
    initYearMonthOptions();
    siteUrlInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        loadMedia();
      }
    });
  </script>
</body>
</html>
