<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>検索ワードにヒットするWordPressサイト検索</title>
  <style>
    :root {
      --bg-1: #020617;
      --bg-2: #111827;
      --panel: rgba(15, 23, 42, 0.85);
      --panel-border: #243244;
      --text: #e5eef8;
      --muted: #93a4b8;
      --danger: #f87171;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(56, 189, 248, 0.16), transparent 32%),
        radial-gradient(circle at bottom right, rgba(34, 197, 94, 0.12), transparent 26%),
        linear-gradient(150deg, var(--bg-1), #0f172a 45%, var(--bg-2));
      min-height: 100vh;
    }

    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 24px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.7rem, 4vw, 2.5rem);
      line-height: 1.15;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .lead {
      max-width: 820px;
      margin-bottom: 20px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      padding: 18px;
      backdrop-filter: blur(10px);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.24);
      margin-bottom: 16px;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 180px 140px;
      gap: 10px;
      align-items: center;
    }

    input[type="text"],
    select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #091221;
      color: var(--text);
      font: inherit;
    }

    input::placeholder {
      color: #6b7c92;
    }

    button {
      padding: 12px 16px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #38bdf8, #22d3ee);
      color: #082f49;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .inline-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid #334155;
    }

    .status {
      margin-top: 12px;
      min-height: 22px;
      color: var(--muted);
    }

    .status.error {
      color: var(--danger);
    }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      color: var(--muted);
    }

    .pill-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pill {
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #223247;
      font-size: 0.9rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }

    .card {
      border: 1px solid #203041;
      border-radius: 16px;
      background: rgba(9, 18, 33, 0.95);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }

    .card-head {
      padding: 16px 16px 10px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      margin-bottom: 10px;
      background: rgba(34, 197, 94, 0.16);
      color: #86efac;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .card h2 {
      margin: 0 0 8px;
      font-size: 1.05rem;
      line-height: 1.45;
    }

    .card h2 a,
    .links a {
      color: #7dd3fc;
      text-decoration: none;
    }

    .card h2 a:hover,
    .links a:hover {
      text-decoration: underline;
    }

    .origin {
      color: #bfdbfe;
      font-size: 0.88rem;
      word-break: break-all;
    }

    .card-body {
      padding: 14px 16px 16px;
      display: grid;
      gap: 12px;
    }

    .desc {
      color: var(--muted);
      line-height: 1.7;
      word-break: break-word;
    }

    .kv {
      display: grid;
      gap: 8px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .kv strong {
      color: var(--text);
      font-weight: 700;
    }

    .links {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 0.92rem;
    }

    .empty {
      padding: 24px;
      border-radius: 16px;
      border: 1px dashed #334155;
      color: var(--muted);
      text-align: center;
      line-height: 1.8;
    }

    .note-list {
      display: grid;
      gap: 8px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    @media (max-width: 760px) {
      .wrap {
        padding: 16px;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>検索ワードにヒットするWordPressサイト検索</h1>
    <p class="lead">
      検索ワードからWeb検索結果を取得し、各候補ドメインの <code>/wp-json/</code> を確認して
      WordPressサイトだけを抽出します。
    </p>

    <section class="panel">
      <div class="controls">
        <input id="keywordInput" type="text" placeholder="例: 生成AI ニュース / 旅行ブログ / レシピ" />
        <select id="queryMode" aria-label="検索モード">
          <option value="plain">通常検索</option>
          <option value="strict">WordPress寄りで検索</option>
        </select>
        <button id="searchBtn">検索する</button>
      </div>
      <div class="inline-actions">
        <button id="sampleBtn" class="ghost" type="button">サンプルを入れる</button>
        <button id="clearBtn" class="ghost" type="button">結果をクリア</button>
      </div>
      <div id="status" class="status"></div>
      <div class="note-list">
        <div>検索元: Bing の検索結果HTMLを CORSプロキシ経由で取得</div>
        <div>WordPress判定: 候補ドメインの <code>wp-json</code> を CORSプロキシ経由で検証</div>
        <div>注意: 検索順位と公開REST APIの可否に依存するため、すべてのWordPressサイトが見つかるわけではありません</div>
      </div>
    </section>

    <section class="panel">
      <div class="meta">
        <div class="pill-row">
          <div class="pill">検索語: <span id="currentKeyword">-</span></div>
          <div class="pill">候補ドメイン: <span id="candidateCount">0</span></div>
          <div class="pill">WordPress判定: <span id="wpCount">0</span></div>
        </div>
      </div>
      <div id="results" class="grid"></div>
    </section>
  </div>

  <script>
    const BING_SEARCH_ENDPOINT = "https://www.bing.com/search";
    const CORS_PROXY_ENDPOINT = "https://api.codetabs.com/v1/proxy/?quest=";
    const CACHE_PREFIX = "wp-site-search-v1:";

    const keywordInput = document.getElementById("keywordInput");
    const queryMode = document.getElementById("queryMode");
    const searchBtn = document.getElementById("searchBtn");
    const sampleBtn = document.getElementById("sampleBtn");
    const clearBtn = document.getElementById("clearBtn");
    const statusEl = document.getElementById("status");
    const resultsEl = document.getElementById("results");
    const currentKeywordEl = document.getElementById("currentKeyword");
    const candidateCountEl = document.getElementById("candidateCount");
    const wpCountEl = document.getElementById("wpCount");

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.classList.toggle("error", isError);
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function normalizeKeyword() {
      const keyword = keywordInput.value.trim();
      if (!keyword) {
        throw new Error("検索ワードを入力してください。");
      }
      return keyword;
    }

    function buildSearchQuery(keyword, mode) {
      if (mode === "strict") {
        return `${keyword} ("WordPress" OR "wp-content" OR "wp-json")`;
      }
      return keyword;
    }

    function buildCacheKey(keyword, mode) {
      return `${CACHE_PREFIX}${mode}:${keyword.toLowerCase()}`;
    }

    function loadCache(keyword, mode) {
      try {
        const raw = localStorage.getItem(buildCacheKey(keyword, mode));
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (!parsed || !Array.isArray(parsed.results)) return null;
        return parsed;
      } catch (_) {
        return null;
      }
    }

    function saveCache(keyword, mode, results, candidateCount) {
      try {
        localStorage.setItem(
          buildCacheKey(keyword, mode),
          JSON.stringify({
            cachedAt: new Date().toISOString(),
            candidateCount,
            results
          })
        );
      } catch (_) {
        // Ignore storage errors.
      }
    }

    async function fetchText(url) {
      const response = await fetch(url, {
        headers: {
          Accept: "text/html, text/plain;q=0.9, */*;q=0.8"
        }
      });
      if (!response.ok) {
        throw new Error(`取得に失敗しました: ${response.status} ${response.statusText}`);
      }
      return response.text();
    }

    function decodeBingResultUrl(rawHref) {
      try {
        const normalized = String(rawHref).replace(/&amp;/g, "&");
        const wrappedUrl = new URL(normalized, BING_SEARCH_ENDPOINT);
        const encoded = wrappedUrl.searchParams.get("u");
        if (!encoded) {
          const directUrl = new URL(normalized, BING_SEARCH_ENDPOINT);
          directUrl.searchParams.delete("msockid");
          return directUrl.toString();
        }

        const base64 = encoded.replace(/^a1/, "");
        const decoded = atob(base64);
        const resultUrl = new URL(decoded);
        resultUrl.searchParams.delete("msockid");
        return resultUrl.toString();
      } catch (_) {
        return null;
      }
    }

    async function searchCandidates(keyword, mode) {
      const query = buildSearchQuery(keyword, mode);
      const searchUrl = `${BING_SEARCH_ENDPOINT}?${new URLSearchParams({
        q: query,
        setlang: "ja",
        cc: "jp",
        mkt: "ja-JP"
      }).toString()}`;
      const proxyUrl = `${CORS_PROXY_ENDPOINT}${encodeURIComponent(searchUrl)}`;
      const html = await fetchText(proxyUrl);
      return parseBingSearchResults(html);
    }

    function parseBingSearchResults(html) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, "text/html");
      const items = [...doc.querySelectorAll("li.b_algo")].map((item) => {
        const linkEl = item.querySelector("h2 a");
        if (!linkEl) return null;
        const decodedUrl = decodeBingResultUrl(linkEl.getAttribute("href"));
        if (!decodedUrl) return null;
        return {
          link: decodedUrl,
          title: linkEl.textContent?.trim() || decodedUrl,
          description: item.querySelector(".b_caption p")?.textContent?.trim() || ""
        };
      }).filter(Boolean);

      return dedupeByOrigin(items);
    }

    function dedupeByOrigin(items) {
      const map = new Map();
      items.forEach((item) => {
        try {
          const url = new URL(item.link);
          if (!/^https?:$/i.test(url.protocol)) return;
          const origin = url.origin;
          if (map.has(origin)) return;
          map.set(origin, {
            origin,
            pageUrl: item.link,
            title: item.title || origin,
            snippet: item.description || "",
            host: url.hostname
          });
        } catch (_) {
          // Skip invalid result URLs.
        }
      });
      return [...map.values()];
    }

    async function verifyWordPressSite(candidate) {
      const targetUrl = `${candidate.origin}/wp-json/`;
      const proxyUrl = `${CORS_PROXY_ENDPOINT}${encodeURIComponent(targetUrl)}`;
      const response = await fetch(proxyUrl, {
        headers: {
          Accept: "application/json, text/plain;q=0.9, */*;q=0.8"
        }
      });

      if (!response.ok) {
        return null;
      }

      const text = await response.text();
      let payload;
      try {
        payload = JSON.parse(text);
      } catch (_) {
        return null;
      }

      if (!payload || typeof payload !== "object") {
        return null;
      }

      const hasWpSignature =
        Array.isArray(payload.namespaces) ||
        (payload.routes && typeof payload.routes === "object") ||
        typeof payload.home === "string";

      if (!hasWpSignature) {
        return null;
      }

      return {
        ...candidate,
        siteName: payload.name || candidate.host,
        siteDescription: payload.description || "",
        homeUrl: payload.home || payload.url || candidate.origin,
        namespacesCount: Array.isArray(payload.namespaces) ? payload.namespaces.length : 0
      };
    }

    async function runWithConcurrency(items, worker, concurrency) {
      const results = [];
      let cursor = 0;

      async function consume() {
        while (cursor < items.length) {
          const currentIndex = cursor;
          cursor += 1;
          results[currentIndex] = await worker(items[currentIndex], currentIndex);
        }
      }

      const workers = [];
      for (let i = 0; i < Math.min(concurrency, items.length); i += 1) {
        workers.push(consume());
      }
      await Promise.all(workers);
      return results;
    }

    function renderEmpty(message) {
      resultsEl.innerHTML = `<div class="empty">${escapeHtml(message)}</div>`;
    }

    function renderResults(results) {
      if (results.length === 0) {
        renderEmpty("WordPressサイトは見つかりませんでした。検索語を変えるか、\"WordPress寄りで検索\" を試してください。");
        return;
      }

      resultsEl.innerHTML = results.map((item) => `
        <article class="card">
          <div class="card-head">
            <div class="badge">WordPress確認済み</div>
            <h2><a href="${escapeHtml(item.pageUrl)}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.title)}</a></h2>
            <div class="origin">${escapeHtml(item.origin)}</div>
          </div>
          <div class="card-body">
            <div class="desc">${escapeHtml(item.snippet || "説明は取得できませんでした。")}</div>
            <div class="kv">
              <div><strong>サイト名:</strong> ${escapeHtml(item.siteName)}</div>
              <div><strong>サイト説明:</strong> ${escapeHtml(item.siteDescription || "なし")}</div>
              <div><strong>REST名前空間数:</strong> ${escapeHtml(String(item.namespacesCount))}</div>
            </div>
            <div class="links">
              <a href="${escapeHtml(item.homeUrl)}" target="_blank" rel="noopener noreferrer">サイトを開く</a>
              <a href="${escapeHtml(item.origin)}/wp-json/" target="_blank" rel="noopener noreferrer">wp-json を開く</a>
            </div>
          </div>
        </article>
      `).join("");
    }

    function updateMeta(keyword, candidateCount, resultCount) {
      currentKeywordEl.textContent = keyword || "-";
      candidateCountEl.textContent = String(candidateCount);
      wpCountEl.textContent = String(resultCount);
    }

    function clearResults() {
      keywordInput.value = "";
      resultsEl.innerHTML = "";
      setStatus("");
      updateMeta("", 0, 0);
      renderEmpty("ここに検索結果が表示されます。");
    }

    async function searchWordPressSites() {
      searchBtn.disabled = true;
      const mode = queryMode.value;

      try {
        const keyword = normalizeKeyword();
        updateMeta(keyword, 0, 0);
        renderEmpty("候補サイトを検索しています...");
        setStatus("検索結果を取得しています...");

        const cached = loadCache(keyword, mode);
        if (cached) {
          renderResults(cached.results);
          updateMeta(keyword, cached.candidateCount || cached.results.length, cached.results.length);
          setStatus(`キャッシュを表示しました。保存時刻: ${new Date(cached.cachedAt).toLocaleString()}`);
          return;
        }

        const candidates = await searchCandidates(keyword, mode);
        updateMeta(keyword, candidates.length, 0);

        if (candidates.length === 0) {
          renderEmpty("検索候補が見つかりませんでした。");
          setStatus("候補ドメインを取得できませんでした。", true);
          return;
        }

        let verifiedCount = 0;
        const verifiedResults = (await runWithConcurrency(
          candidates,
          async (candidate, index) => {
            setStatus(`WordPress判定中... ${index + 1}/${candidates.length} (${candidate.host})`);
            const verified = await verifyWordPressSite(candidate);
            if (verified) {
              verifiedCount += 1;
              updateMeta(keyword, candidates.length, verifiedCount);
            }
            return verified;
          },
          3
        )).filter(Boolean);

        renderResults(verifiedResults);
        updateMeta(keyword, candidates.length, verifiedResults.length);
        saveCache(keyword, mode, verifiedResults, candidates.length);
        setStatus(`完了: ${verifiedResults.length} 件のWordPressサイトを見つけました。`);
      } catch (error) {
        const message = error instanceof Error ? error.message : String(error);
        renderEmpty("検索できませんでした。入力やネットワーク状態を確認してください。");
        setStatus(`エラー: ${message}`, true);
      } finally {
        searchBtn.disabled = false;
      }
    }

    searchBtn.addEventListener("click", searchWordPressSites);
    sampleBtn.addEventListener("click", () => {
      keywordInput.value = "旅行ブログ";
      keywordInput.focus();
    });
    clearBtn.addEventListener("click", clearResults);
    keywordInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        searchWordPressSites();
      }
    });

    renderEmpty("ここに検索結果が表示されます。");
  </script>
</body>
</html>
